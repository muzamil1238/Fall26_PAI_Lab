<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Price App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4">📈 Stock Price Checker</h2>

        <div class="input-group mb-3">
            <input type="text" id="symbol" class="form-control" placeholder="Enter Stock Symbol (e.g. AAPL)">
            <button class="btn btn-primary" onclick="getStock()">Search</button>
        </div>

        <div id="loading" class="text-center d-none">
            <div class="spinner-border text-primary"></div>
        </div>

        <div id="result" class="mt-4 d-none">
            <h4 id="stockSymbol"></h4>
            <p><strong>Price:</strong> $<span id="price"></span></p>
            <p><strong>Change:</strong> <span id="change"></span></p>
            <p><strong>Previous Close:</strong> $<span id="previousClose"></span></p>
            <p><strong>Volume:</strong> <span id="volume"></span></p>
        </div>

        <div id="error" class="alert alert-danger mt-3 d-none"></div>
    </div>
</div>

<script>
async function getStock() {
    const symbol = document.getElementById("symbol").value;
    const resultDiv = document.getElementById("result");
    const errorDiv = document.getElementById("error");
    const loading = document.getElementById("loading");

    resultDiv.classList.add("d-none");
    errorDiv.classList.add("d-none");
    loading.classList.remove("d-none");

    try {
        const response = await fetch(`/api/stock/${symbol}`);
        const data = await response.json();

        loading.classList.add("d-none");

        if (data.error) {
            errorDiv.innerText = data.error;
            errorDiv.classList.remove("d-none");
            return;
        }

        document.getElementById("stockSymbol").innerText = data.symbol;
        document.getElementById("price").innerText = data.price;
        document.getElementById("change").innerText = data.change + " (" + data.change_percent + ")";
        document.getElementById("previousClose").innerText = data.previous_close;
        document.getElementById("volume").innerText = data.volume;

        resultDiv.classList.remove("d-none");

    } catch (error) {
        loading.classList.add("d-none");
        errorDiv.innerText = "Something went wrong!";
        errorDiv.classList.remove("d-none");
    }
}
</script>

</body>
</html>
